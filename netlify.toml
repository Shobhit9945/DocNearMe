[build]
  # Align Netlify's build with the full production pipeline we run locally
  # so both the SPA bundle and SSR/server bundle stay in sync.
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist/spa"


[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"
  
[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"

name: DocNearMeiOS
options:
  bundleIdPrefix: com.docnearme
  deploymentTarget:
    iOS: "18.0"
packages:
  CryptoSwift:
    url: https://github.com/krzyzanowskim/CryptoSwift.git
    from: 1.8.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
targets:
  DocNearMeiOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
    dependencies:
      - package: CryptoSwift
    resources:
      - path: Sources/DocNearMeiOS/montserrat
      - path: Sources/DocNearMeiOS/Assets.xcassets
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/DocNearMeiOS/Info.plist
      properties:
        CFBundleDisplayName: DocNearMe
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "We use your location to show nearby clinics."
